<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Armées Peintes</title>
<meta name="description" content="Peins des armées et regarde-les s'affronter.">
<style>
  :root {
    --bg: #f6f6f0; --panel: #ffffff; --ink: #2b2433; --muted: #8a8494; --line: #ebe9ef;
    --red: #de3a34; --blue: #3470f0; --go: #2fb24c; --go-d: #23893a; --shadow: 0 2px 0 rgba(43,36,51,.12), 0 6px 18px rgba(43,36,51,.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 600 14px/1.3 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  #logo { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 18px; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; pointer-events: none; }
  #logo b { color: var(--red); } #logo i { font-style: normal; color: var(--blue); }

  #labels { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; pointer-events: none; transition: opacity .3s; }
  #labels span { flex: 1; text-align: center; font-weight: 800; font-size: 15px; }
  #labels .l { color: var(--red); } #labels .r { color: var(--blue); }
  .battle #labels { opacity: 0; }

  /* toolbar */
  #bar { position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); max-width: calc(100vw - 210px); }
  #tabs { display: flex; gap: 2px; padding-left: 10px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 7px 12px 6px; border-radius: 12px 12px 0 0; color: var(--muted); white-space: nowrap; font-size: 13px; }
  .tab.on { background: var(--panel); color: var(--ink); box-shadow: 0 -2px 6px rgba(43,36,51,.06); }
  #tools { background: var(--panel); border-radius: 18px; padding: 8px; display: flex; gap: 2px; box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; }
  #tools::-webkit-scrollbar { display: none; }
  .tool { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; position: relative; }
  .tool img { width: 46px; height: 46px; pointer-events: none; transition: transform .12s; }
  .tool:hover img { transform: scale(1.12); }
  .tool.on { background: #efedf3; }
  .tool.on::after { content: ""; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 2.5px var(--ink); }

  #name { position: fixed; pointer-events: none; padding: 4px 9px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 12px; opacity: 0; transition: opacity .12s; white-space: nowrap; z-index: 5; }
  #name.show { opacity: 1; }

  /* right controls */
  #ctl { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 10px; }
  .round { width: 48px; height: 48px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; }
  .round svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .round:hover { transform: translateY(-1px); }
  #start { height: 64px; min-width: 132px; padding: 0 24px; border-radius: 20px; background: var(--go); color: #fff; font-size: 21px; font-weight: 900;
    box-shadow: 0 5px 0 var(--go-d), 0 10px 20px rgba(47,178,76,.3); transition: transform .08s, box-shadow .08s; }
  #start:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--go-d); }
  #start.reset { background: var(--ink); box-shadow: 0 5px 0 #000, 0 10px 20px rgba(0,0,0,.2); }

  /* end-of-battle pill + stats */
  #end { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -90px); transition: transform .35s cubic-bezier(.2,1.4,.4,1);
    background: var(--panel); border-radius: 999px; box-shadow: var(--shadow); padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 800; white-space: nowrap; }
  #end.show { transform: translate(-50%, 0); }
  #end button { background: #efedf3; border-radius: 999px; padding: 8px 14px; font-size: 13px; }
  #stats { position: fixed; inset: 0; background: rgba(43,36,51,.35); display: none; place-items: center; z-index: 10; padding: 16px; }
  #stats.show { display: grid; }
  #card { background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px 20px 16px; }
  #card h2 { margin: 0 0 2px; font-size: 24px; font-weight: 900; }
  #card .sub { color: var(--muted); margin-bottom: 14px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .side { border-radius: 16px; padding: 12px; background: #f6f5f8; }
  .side h3 { margin: 0 0 8px; font-size: 16px; }
  .kv { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; padding: 2px 0; color: var(--muted); }
  .kv b { color: var(--ink); }
  .mvp { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 2px solid var(--line); }
  .mvp img { width: 34px; height: 34px; }
  .mvp small { display: block; color: var(--muted); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: right; color: var(--muted); font-size: 11px; font-weight: 700; padding: 4px 6px; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 3px 6px; border-top: 1px solid var(--line); }
  td img { width: 22px; height: 22px; vertical-align: middle; margin-right: 4px; }
  .r { color: var(--red); } .b { color: var(--blue); }
  #close { margin-top: 14px; width: 100%; padding: 11px; border-radius: 14px; background: #efedf3; }

  @media (max-width: 640px) {
    #logo { font-size: 17px; left: 12px; }
    #labels { top: 44px; }
    #bar { left: 8px; right: 8px; max-width: none; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 72px); }
    #ctl { right: 8px; left: 8px; justify-content: flex-end; bottom: max(8px, env(safe-area-inset-bottom)); }
    #start { flex: 1; height: 58px; }
    .tool { width: 46px; height: 46px; } .tool img { width: 40px; height: 40px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="logo">Armées <b>Pein</b><i>tes</i></div>
<div id="labels"><span class="l">Équipe rouge</span><span class="r">Équipe bleue</span></div>

<div id="bar"><div id="tabs"></div><div id="tools"></div></div>
<div id="name"></div>

<div id="ctl">
  <button id="clear" class="round" title="Tout effacer (C)" aria-label="Tout effacer"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
  <button id="start">Lancer</button>
</div>

<div id="end"><span id="endTxt"></span><button id="seeStats">Voir les stats</button></div>
<div id="stats"><div id="card"></div></div>
<div id="err" style="display:none;position:fixed;inset:30% 20px auto;padding:16px;background:#fff;color:#b00;border-radius:12px;text-align:center"></div>

<script src="js/defs.js"></script>
<script src="js/sprites.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
