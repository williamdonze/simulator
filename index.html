<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pinceau de Guerre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#33452a;
  --panel:rgba(255,252,245,.95);
  --panel-2:#f3eee3;
  --ink:#2a2420;
  --ink-2:#74685d;
  --line:rgba(50,35,20,.13);
  --btn:#ffffff;
  --btn-h:#f7f1e6;
  --sel-bg:#2a2420;
  --sel-ink:#fffaf0;
  --red:#d8413a; --red-d:#8a1e1a;
  --blue:#3b72d8; --blue-d:#1d3c8a;
  --accent:#f0a531; --accent-d:#b9731a;
  --good:#3d9a4b;
  --shadow:0 8px 30px rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:rgba(32,29,27,.95); --panel-2:#2b2724; --ink:#f4efe7; --ink-2:#b4a99d;
    --line:rgba(255,255,255,.11); --btn:#3a3531; --btn-h:#47413c; --sel-bg:#f4efe7; --sel-ink:#221e1b;
  }
}
:root[data-theme="dark"]{
  --panel:rgba(32,29,27,.95); --panel-2:#2b2724; --ink:#f4efe7; --ink-2:#b4a99d;
  --line:rgba(255,255,255,.11); --btn:#3a3531; --btn-h:#47413c; --sel-bg:#f4efe7; --sel-ink:#221e1b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'Fredoka',system-ui,-apple-system,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
button{font-family:inherit;color:inherit}
#panel{position:fixed;left:12px;top:12px;bottom:12px;width:286px;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;z-index:5}
#panel header{padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
#panel header .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--blue));display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
#panel header h1{font-size:19px;line-height:1.05;margin:0;font-weight:700;letter-spacing:.2px}
#panel header small{display:block;font-size:12px;color:var(--ink-2);font-weight:400;margin-top:2px}
#collapse{margin-left:auto;border:0;background:var(--panel-2);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;display:none}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px 10px}
.team{border:2px solid transparent;border-radius:12px;padding:8px 6px;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--panel-2);transition:transform .08s}
.team i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.team[data-t="0"] i{background:var(--red)} .team[data-t="1"] i{background:var(--blue)}
.team.on[data-t="0"]{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,var(--panel-2))}
.team.on[data-t="1"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,var(--panel-2))}
.team:active{transform:scale(.97)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 14px 8px}
.tab{border:0;background:transparent;border-radius:10px;padding:7px 2px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tab.on{background:var(--sel-bg);color:var(--sel-ink)}
#items{flex:1;overflow-y:auto;padding:2px 14px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:start;min-height:0}
#items::-webkit-scrollbar{width:6px}#items::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.item{border:2px solid var(--line);background:var(--btn);border-radius:13px;padding:5px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.item:hover{background:var(--btn-h)}
.item.on{border-color:var(--sel-bg);box-shadow:0 0 0 2px var(--sel-bg) inset}
.item canvas{width:46px;height:46px;image-rendering:auto}
.item span{font-size:11.5px;font-weight:500;line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
#info{margin:0 14px 8px;padding:9px 11px;background:var(--panel-2);border-radius:12px;font-size:12.5px;line-height:1.3;min-height:70px}
#info b{font-size:14px;display:block;margin-bottom:2px}
#info .desc{color:var(--ink-2)}
#info .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
#info .chips span{background:var(--btn);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:500}
.sliders{padding:0 14px 6px;display:grid;gap:4px}
.sliders label{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;font-size:12.5px;font-weight:500;gap:6px}
.sliders output{font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.scen{padding:4px 14px 14px}
.scen .ttl{font-size:12px;color:var(--ink-2);font-weight:600;margin:2px 0 5px;text-transform:uppercase;letter-spacing:.6px}
.scen .row{display:flex;flex-wrap:wrap;gap:5px}
.scen button{border:0;background:var(--panel-2);border-radius:9px;padding:6px 8px;font-size:12px;font-weight:500;cursor:pointer}
.scen button:hover{background:var(--btn-h)}

#top{position:fixed;top:12px;left:310px;right:12px;display:flex;justify-content:center;pointer-events:none;z-index:4}
#counts{pointer-events:auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:8px 14px;display:flex;align-items:center;gap:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:min(440px,100%)}
#counts .n{min-width:64px;font-size:17px}
#counts .n.r{color:var(--red);text-align:right}#counts .n.b{color:var(--blue)}
#bar{flex:1;height:10px;border-radius:5px;overflow:hidden;background:var(--blue);display:flex;min-width:80px}
#bar i{display:block;background:var(--red);height:100%;width:50%;transition:width .25s}
#perf{position:fixed;right:14px;top:66px;font-size:11.5px;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:right;pointer-events:none;z-index:4;font-variant-numeric:tabular-nums;line-height:1.35}

#controls{position:fixed;bottom:16px;left:310px;right:12px;display:flex;justify-content:center;pointer-events:none;z-index:4}
#controls .wrap{pointer-events:auto;display:flex;gap:8px;align-items:center;background:var(--panel);padding:8px;border-radius:20px;box-shadow:var(--shadow)}
.cbtn{border:0;background:var(--panel-2);height:46px;min-width:46px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;padding:0 12px;display:flex;align-items:center;gap:6px}
.cbtn:hover{background:var(--btn-h)}
.cbtn svg{width:20px;height:20px}
#go{background:var(--accent);color:#2a1a05;font-size:18px;padding:0 22px;box-shadow:inset 0 -3px 0 var(--accent-d)}
#go:hover{filter:brightness(1.05)}
#go.running{background:var(--panel-2);color:var(--ink);box-shadow:none}

#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,1.4,.4,1);z-index:6;
  background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:20px 30px;text-align:center}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#banner h2{margin:0 0 4px;font-size:30px}
#banner p{margin:0 0 12px;color:var(--ink-2)}
#banner .row{display:flex;gap:8px;justify-content:center}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:rgba(20,16,12,.82);color:#fff;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7;white-space:nowrap}
#toast.show{opacity:1}
#hint{position:fixed;left:calc(50% + 149px);top:50%;transform:translate(-50%,-50%);color:#fff;text-align:center;pointer-events:none;z-index:3;text-shadow:0 2px 8px rgba(0,0,0,.45);transition:opacity .5s;max-width:min(520px,90vw)}
#hint h2{font-size:30px;margin:0 0 6px}
#hint p{margin:0;font-size:16px;opacity:.9;line-height:1.4}
#err{position:fixed;inset:0;display:none;place-items:center;background:#222;color:#fff;font-size:18px;z-index:20;padding:20px;text-align:center}

@media (max-width:760px){
  #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:48vh;border-radius:18px}
  #panel.min #items,#panel.min .sliders,#panel.min .scen,#panel.min .tabs,#panel.min .teams{display:none}
  #collapse{display:block}
  #panel header{padding:10px 12px 6px}
  #panel header small{display:none}
  #panel header h1{font-size:17px}
  .teams{padding:2px 12px 8px}
  .team{padding:6px}
  .tabs{padding:0 12px 6px}
  #items{flex:none;display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:74px;overflow-x:auto;overflow-y:hidden;padding:2px 12px 8px}
  .item canvas{width:40px;height:40px}
  #info{display:none}
  .sliders{padding:0 12px 4px}
  .scen{padding:2px 12px 10px}
  .scen .ttl{display:none}
  .scen .row{flex-wrap:nowrap;overflow-x:auto}
  .scen button{white-space:nowrap}
  #top{left:8px;right:8px;top:8px}
  #counts{padding:6px 10px;min-width:0;width:100%}
  #counts .n{min-width:48px;font-size:15px}
  #controls{left:8px;right:8px;top:58px;bottom:auto}
  #controls .wrap{padding:6px;gap:6px;border-radius:16px}
  .cbtn{height:38px;min-width:38px;padding:0 9px;font-size:14px;border-radius:11px}
  #go{font-size:15px;padding:0 14px}
  .cbtn .lbl{display:none}
  #hint{left:50%;top:32%}
  #hint h2{font-size:22px}#hint p{font-size:14px}
  #perf{display:none}
  #toast{top:112px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="panel">
  <header>
    <div class="logo">⚔</div>
    <div><h1>Pinceau de Guerre</h1><small>Peins des armées, regarde-les s'affronter</small></div>
    <button id="collapse" aria-label="Réduire">▾</button>
  </header>
  <div class="teams">
    <button class="team on" data-t="0"><i></i>Rouges</button>
    <button class="team" data-t="1"><i></i>Bleus</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-c="units">Unités</button>
    <button class="tab" data-c="builds">Bâtiments</button>
    <button class="tab" data-c="decor">Décor</button>
    <button class="tab" data-c="powers">Pouvoirs</button>
  </div>
  <div id="items"></div>
  <div id="info"></div>
  <div class="sliders">
    <label>Pinceau <input type="range" id="brush" min="4" max="160" value="40"><output id="brushV">40</output></label>
    <label>Densité <input type="range" id="dens" min="5" max="100" value="70"><output id="densV">70%</output></label>
  </div>
  <div class="scen">
    <div class="ttl">Scénarios</div>
    <div class="row">
      <button data-s="clash">Choc des armées</button>
      <button data-s="siege">Siège du château</button>
      <button data-s="mega">Méga-bataille 30k</button>
      <button data-s="village">Raid du village</button>
      <button data-s="forest">Forêt en feu</button>
      <button data-s="random">Aléatoire</button>
    </div>
  </div>
</div>

<div id="top"><div id="counts"><span class="n r" id="cR">0</span><div id="bar"><i id="barR"></i></div><span class="n b" id="cB">0</span></div></div>
<div id="perf"></div>

<div id="controls"><div class="wrap">
  <button class="cbtn" id="go">⚔ Combattre !</button>
  <button class="cbtn" id="pause" title="Pause (P)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <button class="cbtn" id="speed" title="Vitesse">1×</button>
  <button class="cbtn" id="restart" title="Recommencer le même combat (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lbl">Rejouer</span></button>
  <button class="cbtn" id="clear" title="Tout effacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="lbl">Vider</span></button>
</div></div>

<div id="banner"><h2 id="bTitle">Victoire !</h2><p id="bSub"></p><div class="row"><button class="cbtn" id="bAgain">Rejouer</button><button class="cbtn" id="bClose">Continuer</button></div></div>
<div id="toast"></div>
<div id="hint"><h2>Peins ton armée</h2><p>Choisis une unité, peins-la sur le terrain pour chaque camp, puis lance le combat.<br>Clic droit / deux doigts pour déplacer · molette / pincer pour zoomer.</p></div>
<div id="err"></div>
<script>
'use strict';
/* =====================================================================
   PINCEAU DE GUERRE — simulateur de batailles massives
   Simulation : tableaux typés (SoA) + grille spatiale à tri par comptage
   Rendu : WebGL2, un seul atlas, quads instanciés (≈ 1 draw call / passe)
   ===================================================================== */
const TAU = Math.PI * 2;
const W = 3200, H = 2000;            // monde en pixels-monde
const G = 420;                        // gravité (px/s²)
const MAXU = 100000;                  // unités max
const MAXP = 40000;                   // projectiles max
const MAXF = 60000;                   // particules max
const MAXINST = 280000;               // sprites max par image
const CELL = 16, GW = W / CELL, GH = H / CELL, NC = GW * GH;
const BCELL = 64, BGW = W / BCELL, BGH = Math.ceil(H / BCELL), NBC = BGW * BGH;
const CC = 160, CGW = W / CC, CGH = Math.ceil(H / CC), NCC = CGW * CGH;
const TCs = 4, TW = W / TCs, TH = H / TCs;

const AI_MELEE = 0, AI_RANGED = 1, AI_HEAL = 2, AI_SUPPORT = 3, AI_SAPPER = 4, AI_FLAME = 5, AI_NECRO = 6;
const DMG_MELEE = 0, DMG_PROJ = 1, DMG_EXPL = 2, DMG_FIRE = 3, DMG_FALL = 4, DMG_MAGIC = 5;
const PJ_ARROW = 0, PJ_BOLT = 1, PJ_FIREBALL = 2, PJ_BOMB = 3, PJ_BOULDER = 4, PJ_DARK = 5, PJ_BALLISTA = 6, PJ_CANNON = 7, PJ_METEOR = 8;

const TEAMC = [
  { main: '#d8413a', dark: '#8a1e1a', light: '#f19a8e', rgb: [0.85, 0.25, 0.23] },
  { main: '#3b72d8', dark: '#1d3c8a', light: '#93b6f2', rgb: [0.23, 0.45, 0.85] },
  { main: '#8a8a8a', dark: '#555555', light: '#cccccc', rgb: [0.6, 0.6, 0.6] },
];
const TEAM_NAME = ['Rouges', 'Bleus'];

/* ------------------------------ UNITÉS ------------------------------ */
// spd: px/s, range: portée de mêlée (bord à bord) ou de tir, r: rayon de collision
const UNITS = [
  { key: 'paysan', name: 'Paysan', desc: "Armé d'une fourche. Faible, nombreux, il prend la fuite quand il est gravement blessé.",
    hp: 40, spd: 34, dmg: 6, cd: 1.0, range: 2, r: 3.4, ai: AI_MELEE, flee: 0.35,
    look: { weapon: 'fork', helmet: 'straw', tunic: 'light', pants: '#6b5236' } },
  { key: 'soldat', name: 'Soldat', desc: 'Épée et bouclier rond. Le fantassin polyvalent de toute armée.',
    hp: 85, spd: 30, dmg: 12, cd: 0.9, range: 2, r: 3.6, armor: 1, ai: AI_MELEE,
    look: { weapon: 'sword', helmet: 'iron', shield: 'round' } },
  { key: 'lancier', name: 'Lancier', desc: 'Grande allonge. Inflige ×3 aux cavaliers et brise leurs charges.',
    hp: 75, spd: 28, dmg: 11, cd: 1.1, range: 9, r: 3.6, armor: 1, ai: AI_MELEE, antiMount: true,
    look: { weapon: 'spear', helmet: 'kettle' } },
  { key: 'chevalier', name: 'Chevalier', desc: 'Armure de plates : réduit fortement chaque coup reçu. Lent mais redoutable.',
    hp: 230, spd: 20, dmg: 22, cd: 1.3, range: 2.5, r: 3.9, armor: 5, ai: AI_MELEE,
    look: { weapon: 'sword', helmet: 'knight', armor: true, shield: 'kite' } },
  { key: 'cavalier', name: 'Cavalier', desc: 'Très rapide. Sa charge démultiplie les dégâts et piétine les rangs ennemis.',
    hp: 160, spd: 72, dmg: 16, cd: 1.2, range: 3, r: 5.4, armor: 2, ai: AI_MELEE, mounted: true, charge: true, accel: 2.2,
    look: { weapon: 'lance', helmet: 'iron', armor: true, mounted: true } },
  { key: 'archer', name: 'Archer', desc: 'Tire des flèches en cloche à longue portée et recule face à la mêlée.',
    hp: 45, spd: 30, dmg: 10, cd: 1.5, range: 175, minRange: 38, r: 3.4, ai: AI_RANGED, proj: PJ_ARROW, squishy: true,
    look: { weapon: 'bow', helmet: 'hood' } },
  { key: 'arbaletrier', name: 'Arbalétrier', desc: 'Carreaux tendus et perforants qui transpercent plusieurs ennemis alignés.',
    hp: 60, spd: 24, dmg: 26, cd: 2.8, range: 205, r: 3.6, armor: 1, ai: AI_RANGED, proj: PJ_BOLT, squishy: true,
    look: { weapon: 'xbow', helmet: 'kettle', armorHalf: true } },
  { key: 'mage', name: 'Mage', desc: 'Lance des boules de feu explosives qui enflamment la cible et ses voisins.',
    hp: 50, spd: 26, dmg: 22, cd: 3.0, range: 155, minRange: 30, r: 3.4, ai: AI_RANGED, proj: PJ_FIREBALL, squishy: true,
    look: { weapon: 'staff', helmet: 'wizard', robe: true } },
  { key: 'pretre', name: 'Prêtre', desc: "Soigne l'allié le plus blessé à proximité, éteint les flammes, et fuit les ennemis.",
    hp: 55, spd: 28, dmg: 14, cd: 1.1, range: 85, r: 3.4, ai: AI_HEAL, squishy: true,
    look: { weapon: 'staffH', helmet: 'hoodW', robe: true, tunic: '#efe9da', sash: 'main' } },
  { key: 'bouclier', name: 'Pavoisier', desc: 'Immense pavois : bloque 85 % des projectiles venant de face et attire les attaques.',
    hp: 170, spd: 22, dmg: 8, cd: 1.2, range: 2, r: 4.0, armor: 3, ai: AI_MELEE, shield: true,
    look: { weapon: 'sword', helmet: 'iron', shield: 'tower' } },
  { key: 'berserker', name: 'Berserker', desc: 'Plus il est blessé, plus il frappe vite et fort. Ses haches touchent plusieurs ennemis.',
    hp: 130, spd: 40, dmg: 15, cd: 0.75, range: 2.5, r: 3.8, ai: AI_MELEE, rage: true, cleave: 7, cleaveN: 3,
    look: { weapon: 'axes', helmet: 'horned', body: 'skin', pants: 'main', sash: 'dark' } },
  { key: 'assassin', name: 'Assassin', desc: 'Invisible tant qu’il ne frappe pas. Traque archers, mages et prêtres et bondit sur eux.',
    hp: 55, spd: 56, dmg: 34, cd: 1.0, range: 2, r: 3.3, ai: AI_MELEE, stealth: true, crit: true, dash: true,
    look: { weapon: 'dagger', helmet: 'mask', tunic: 'dark' } },
  { key: 'grenadier', name: 'Grenadier', desc: 'Lance des bombes qui projettent tout le monde en l’air — alliés compris !',
    hp: 55, spd: 28, dmg: 48, cd: 3.6, range: 140, minRange: 34, r: 3.5, ai: AI_RANGED, proj: PJ_BOMB, squishy: true,
    look: { weapon: 'bomb', helmet: 'bandana' } },
  { key: 'pyromane', name: 'Pyromane', desc: 'Crache un cône de flammes. Embrase les unités, les arbres et les barils.',
    hp: 75, spd: 28, dmg: 5, cd: 0.16, range: 34, r: 3.6, ai: AI_FLAME, squishy: true, fireproof: true,
    look: { weapon: 'torch', helmet: 'goggles', tunic: 'dark' } },
  { key: 'necromancien', name: 'Nécromancien', desc: 'Relève les cadavres proches en squelettes à son service et lance des traits d’ombre.',
    hp: 70, spd: 24, dmg: 9, cd: 1.6, range: 120, minRange: 40, r: 3.5, ai: AI_NECRO, proj: PJ_DARK, squishy: true,
    look: { weapon: 'staffN', helmet: 'hoodD', robe: true, tunic: '#2b2333', sash: 'main' } },
  { key: 'squelette', name: 'Squelette', desc: 'Mort-vivant fragile mais infatigable. Ne laisse pas de cadavre.',
    hp: 32, spd: 32, dmg: 8, cd: 1.0, range: 2, r: 3.3, ai: AI_MELEE, undead: true,

    else ghost = { kind: tool.kind, id: tool.id, team: curTeam, x: wx, y: wy, r: brushR, color: tool.kind === 'unit' ? TEAMC[curTeam].rgb.map(v => Math.min(1, v * 1.25)) : tool.kind === 'power' ? [1, 0.85, 0.4] : [1, 1, 1] };
  } else ghost = null;
  const drawn = render(now / 1000);
  const t2 = performance.now();
  simMsS += (t1 - t0 - simMsS) * 0.08; renMsS += (t2 - t1 - renMsS) * 0.08;
  checkEnd(ft);
  if (toastT > 0) { toastT -= ft; if (toastT <= 0) $('toast').classList.remove('show'); }
  uiT -= ft;
  if (uiT <= 0) {
    uiT = 0.25;
    const r = teamCount[0], b = teamCount[1];
    $('cR').textContent = r.toLocaleString('fr'); $('cB').textContent = b.toLocaleString('fr');
    $('barR').style.width = (r + b ? r / (r + b) * 100 : 50) + '%';
    $('perf').innerHTML = `${Math.round(fpsS)} i/s · ${(nU).toLocaleString('fr')} unités<br>sim ${simMsS.toFixed(1)} ms · rendu ${renMsS.toFixed(1)} ms<br>${nP.toLocaleString('fr')} projectiles · ${nF.toLocaleString('fr')} effets · ${builds.length} objets`;
  }
}
// démarrage
fitCamera();
setTeam(0); syncControls();
requestAnimationFrame(frame);
window.__game = { get nU() { return nU; }, SCEN, toggleBattle, step, spawnUnit, UID, setSpeed: (s) => { speed = s; }, stats, teamCount, get nP() { return nP; }, get nF() { return nF; }, builds: () => builds };
</script>
</body>
